[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-cli"
version = "0.1.0"
description = "A tiny command-line todo list using only the standard library"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
todo = "todo.cli:main"

[tool.setuptools]
packages = ["todo"]
